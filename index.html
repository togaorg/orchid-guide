<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR CODE 花卉導購網站</title>
    <style>
        :root {
            --ink: #3d3060;          /* 主要文字：深灰紫 */
            --purple: #7a63b8;       /* 主色：柔和薰衣草紫 */
            --purple-soft: #e4dbf5;  /* 淡紫底 */
            --fb: #5f86d1;           /* 柔和藍 */
            --ig: #cf7397;           /* 柔和玫瑰粉 */
        }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            color: var(--ink); margin: 0; padding-bottom: 60px; min-height: 100vh;
            background-color: #ffffff;
        }
        header {
            text-align: center; padding: 56px 20px 40px; margin-bottom: 24px;
            /* 只有上方標題區是水彩紫，底部柔和淡出到白色 */
            background-color: #ece3f8;
            background-image:
                radial-gradient(ellipse 60% 90% at 5% 10%,  rgba(176,152,226,0.60), transparent 75%),
                radial-gradient(ellipse 55% 90% at 95% 15%, rgba(226,170,210,0.50), transparent 75%),
                radial-gradient(ellipse 50% 80% at 50% 60%, rgba(200,182,236,0.40), transparent 80%);
            -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
                    mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
        }
        header h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: 0.12em; margin: 0 0 10px; color: var(--ink); }
        header p { margin: 0; color: #7468a0; letter-spacing: 0.08em; }
        header::after { content: ""; display: block; width: 60px; height: 3px; border-radius: 3px; margin: 22px auto 0; background: linear-gradient(90deg, #a68fdc, #dca2c9); }
        .container { max-width: 1000px; margin: 10px auto; padding: 0 24px; }
        .section-title { font-size: 1.15rem; font-weight: 600; margin: 34px 0 18px; padding-left: 12px; border-left: 4px solid #a68fdc; color: var(--ink); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
        .card {
            background: #ffffff;
            border-radius: 20px; padding: 26px 22px 22px; text-align: center;
            border: 1px solid rgba(166,143,220,0.55);
            box-shadow: 0 4px 16px rgba(122,99,184,0.10);
            transition: 0.3s ease; display: flex; flex-direction: column; align-items: center;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(142,124,195,0.16); }
        .company-name { font-size: 1.02rem; font-weight: 600; margin: 0 0 12px; color: var(--ink); min-height: 2.6rem; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        .btn-main {
            display: inline-block; min-width: 140px; padding: 9px 22px; margin-bottom: 10px;
            background: var(--purple); color: white; text-decoration: none;
            border-radius: 999px; font-size: 0.92rem; letter-spacing: 0.05em; transition: 0.2s;
        }
        .btn-main:hover { filter: brightness(0.92); }
        .btn-main.fb { background: var(--fb); }
        .social-row { display: flex; gap: 8px; justify-content: center; }
        .btn-social {
            text-decoration: none; padding: 5px 14px; border-radius: 999px;
            font-size: 0.8rem; background: white; transition: 0.2s;
        }
        .btn-fb { color: var(--fb); border: 1px solid var(--fb); }
        .btn-ig { color: var(--ig); border: 1px solid var(--ig); }
        .btn-fb:hover { background: var(--fb); color: white; }
        .btn-ig:hover { background: var(--ig); color: white; }
        .region-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
        .region-nav button {
            background: #ffffff; color: var(--purple); border: 1px solid #a68fdc;
            padding: 6px 16px; border-radius: 999px; font-size: 0.9rem; font-family: inherit; cursor: pointer; transition: 0.2s;
        }
        .region-nav button:hover, .region-nav button.active { background: var(--purple); border-color: var(--purple); color: white; }
        .region-nav button small { opacity: 0.75; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: -4px 0 14px; }
        .tag { background: var(--purple-soft); color: #6650a8; font-size: 0.76rem; padding: 2px 10px; border-radius: 999px; }
        .status { grid-column: 1 / -1; text-align: center; color: #9a90b8; padding: 40px 0; }
    </style>
</head>
<body>

<header>
    <h1>QR CODE 導購網站</h1>
    <p>連結優質花卉供應商與資材夥伴</p>
</header>

<div class="container">
    <nav class="region-nav" id="region-nav"></nav>
    <div id="suppliers">
        <h2 class="section-title">🌸 花卉供應商 (Orchid & Flower)</h2>
        <div class="grid"><div class="status">資料載入中…</div></div>
    </div>
</div>

<script>
/* ===== 資料來源：Google 試算表（在試算表裡新增、修改、刪除，網頁會自動更新）===== */
var SHEET_ID = "1c0sj9L3-bRkno3RGqhWrlrPHrP8__Cs51OKzqnv8p9c";

/* 縣市按鈕的排列順序（由北到南、再到東部離島）；不在清單裡的排在後面 */
var CITY_ORDER = ["基隆","臺北","新北","桃園","新竹","苗栗","臺中","彰化","南投","雲林","嘉義","臺南","高雄","屏東","宜蘭","花蓮","臺東","澎湖","金門","連江"];

var grid = document.getElementById("suppliers");
var nav = document.getElementById("region-nav");
var ALL = [], CITIES = [], current = "";

function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
}
function cleanUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
}
function showStatus(msg) {
    grid.innerHTML = '<h2 class="section-title">🌸 花卉供應商 (Orchid &amp; Flower)</h2>' +
                     '<div class="grid"><div class="status">' + esc(msg) + '</div></div>';
}
function cityRank(c) {
    var n = c.replace(/^台/, "臺");
    for (var i = 0; i < CITY_ORDER.length; i++) if (n.indexOf(CITY_ORDER[i]) === 0) return i;
    return 999;
}

/* 把試算表資料轉成 [{name, site, fb, ig, cities}] */
function parseTable(table) {
    var cols = table.cols.map(function (c) { return (c.label || "").trim().toLowerCase(); });
    var rows = table.rows.map(function (r) {
        return (r.c || []).map(function (cell) { return cell && cell.v != null ? String(cell.v).trim() : ""; });
    });
    // 如果 Google 沒把第一列當標題，就自己拿第一列當標題
    if (cols.indexOf("公司名") === -1 && rows.length && rows[0].indexOf("公司名") !== -1) {
        cols = rows.shift().map(function (v) { return v.toLowerCase(); });
    }
    function idx(names, fallback) {
        for (var i = 0; i < names.length; i++) { var k = cols.indexOf(names[i]); if (k !== -1) return k; }
        return fallback;
    }
    var iName = idx(["公司名", "公司名稱", "名稱"], 0);
    var iSite = idx(["網站", "官網", "官方網站"], 1);
    var iFb   = idx(["社群", "facebook", "fb"], 2);
    var iIg   = idx(["ig", "instagram"], 3);
    var iCity = idx(["縣市", "地區", "區域"], -1);
    return rows.map(function (r) {
        var raw = iCity === -1 ? "" : (r[iCity] || "");
        // 一家可以填多個縣市，用「、」「,」或空格隔開，例如「臺南市、高雄市」
        var cities = raw.split(/[、,，\/\s]+/).filter(Boolean);
        return { name: r[iName] || "", site: cleanUrl(r[iSite]), fb: cleanUrl(r[iFb]), ig: cleanUrl(r[iIg]), cities: cities };
    }).filter(function (x) { return x.name; });
}

function setup(list) {
    ALL = list;
    var count = {};
    list.forEach(function (x) { x.cities.forEach(function (c) { count[c] = (count[c] || 0) + 1; }); });
    CITIES = Object.keys(count).sort(function (a, b) { return cityRank(a) - cityRank(b); });
    if (CITIES.length > 1) {   // 只有一個縣市或都沒填，就不顯示篩選按鈕
        nav.innerHTML = '<button data-city="">全部 <small>' + list.length + '</small></button>' +
            CITIES.map(function (c) {
                return '<button data-city="' + esc(c) + '">' + esc(c) + ' <small>' + count[c] + '</small></button>';
            }).join("");
        nav.onclick = function (e) {
            var b = e.target.closest("button");
            if (b) { current = b.getAttribute("data-city"); render(); }
        };
    }
    render();
}

function render() {
    if (!ALL.length) { showStatus("目前沒有廠商資料"); return; }
    Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
        b.classList.toggle("active", b.getAttribute("data-city") === current);
    });
    var list = current ? ALL.filter(function (x) { return x.cities.indexOf(current) !== -1; }) : ALL;
    var title = current ? "📍 " + esc(current) + "花卉供應商" : "🌸 花卉供應商 (Orchid &amp; Flower)";
    grid.innerHTML = '<h2 class="section-title">' + title + '</h2><div class="grid">' + cards(list) + '</div>';
}

function cards(list) {
    return list.map(function (x) {
        var html = '<div class="card"><div class="company-name">' + esc(x.name) + '</div>';
        if (x.cities.length) {
            html += '<div class="tags">' + x.cities.map(function (c) { return '<span class="tag">📍 ' + esc(c) + '</span>'; }).join("") + '</div>';
        }
        var social = [];
        if (x.site) {
            html += '<a href="' + esc(x.site) + '" target="_blank" rel="noopener" class="btn-main">官方網站</a>';
            if (x.fb) social.push('<a href="' + esc(x.fb) + '" target="_blank" rel="noopener" class="btn-social btn-fb">Facebook</a>');
        } else if (x.fb) {
            html += '<a href="' + esc(x.fb) + '" target="_blank" rel="noopener" class="btn-main fb">Facebook</a>';
        }
        if (x.ig) social.push('<a href="' + esc(x.ig) + '" target="_blank" rel="noopener" class="btn-social btn-ig">Instagram</a>');
        if (social.length) html += '<div class="social-row">' + social.join("") + '</div>';
        return html + '</div>';
    }).join("");
}

var timer = setTimeout(function () { showStatus("資料載入失敗，請稍後重新整理"); }, 15000);

window.handleSheet = function (resp) {
    clearTimeout(timer);
    if (!resp || resp.status === "error" || !resp.table) { showStatus("資料載入失敗，請稍後重新整理"); return; }
    setup(parseTable(resp.table));
};

var s = document.createElement("script");
s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?headers=1&tqx=out:json;responseHandler:handleSheet&_=" + Date.now();
s.onerror = function () { clearTimeout(timer); showStatus("資料載入失敗，請稍後重新整理"); };
document.body.appendChild(s);
</script>

</body>
</html>
